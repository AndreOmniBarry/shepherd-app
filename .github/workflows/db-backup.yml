name: Nightly database backup

on:
  schedule:
    # 03:00 UTC daily — adjust if you want a different time.
    - cron: '0 3 * * *'
  workflow_dispatch: {}   # lets you also trigger a backup manually from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Ubuntu's default apt repo only ships postgresql-client 16, but
      # Supabase runs Postgres 17 — pg_dump refuses to dump from a server
      # newer than itself ("aborting because of server version mismatch").
      # The official Postgres apt repo (PGDG) is the only source with a
      # matching v17 client; postgresql-common ships the helper script
      # that adds it correctly (signing key + sources file) in one step.
      - name: Install postgresql-client 17
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL secret is not set — see scripts/README-backup.md" >&2
            exit 1
          fi
          # The bare `pg_dump` on PATH still resolved to Ubuntu's
          # pre-installed v16 even after installing postgresql-client-17
          # (an alternatives/PATH-ordering quirk of this runner image) —
          # calling the versioned binary directly sidesteps that entirely.
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges -F c -f shepherd_backup.dump

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: shepherd-db-backup-${{ github.run_id }}
          path: shepherd_backup.dump
          retention-days: 30
